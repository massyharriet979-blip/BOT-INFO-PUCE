<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER CORE - Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:#020a06;color:#fff;font-family:'JetBrains Mono',monospace;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px 20px;position:relative;overflow-x:hidden;overflow-y:auto;
}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.glow-static{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% -15%, rgba(42,255,128,0.22) 0%, transparent 58%),radial-gradient(ellipse at 30% 110%, rgba(0,255,136,0.08) 0%, transparent 45%)}
.glow-move{
  position:fixed;width:600px;height:600px;z-index:1;pointer-events:none;opacity:0.18;
  background:radial-gradient(circle, rgba(42,255,128,0.5) 0%, transparent 70%);
  filter:blur(40px);animation: drift 18s ease-in-out infinite alternate;
}
@keyframes drift{0%{transform:translate(-20%, -10%)}100%{transform:translate(60%, 20%)}}
.wrap{position:relative;z-index:10;width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center}
.logo-wrap{position:relative;width:124px;height:124px;margin-bottom:26px;display:flex;align-items:center;justify-content:center}
.logo-ring{
  position:absolute;inset:-6px;border-radius:50%;
  border:1px dashed rgba(42,255,128,0.28);animation: rotateRing 18s linear infinite;
}
@keyframes rotateRing{to{transform:rotate(360deg)}}
.circle{
  width:118px;height:118px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #173d27, #000);
  border:2px solid #2aff80;
  box-shadow:0 0 0 8px rgba(42,255,128,0.10),0 0 45px rgba(42,255,128,0.55), inset 0 0 22px rgba(42,255,128,0.18);
  display:flex;align-items:center;justify-content:center;
  animation: pulseCore 3.2s ease-in-out infinite;
  position:relative;z-index:2;
}
@keyframes pulseCore{0%,100%{transform:scale(1);box-shadow:0 0 0 8px rgba(42,255,128,0.10),0 0 45px rgba(42,255,128,0.55)}50%{transform:scale(1.02);box-shadow:0 0 0 12px rgba(42,255,128,0.14),0 0 70px rgba(42,255,128,0.8)}}
.circle svg{width:38px;height:38px;stroke:#2aff80;stroke-width:1.8;fill:none;filter:drop-shadow(0 0 8px rgba(42,255,128,0.8))}
.title{font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:700;color:#2aff80;letter-spacing:0.03em;text-shadow:0 0 20px rgba(42,255,128,0.75);margin-bottom:8px;text-align:center}
.moved{font-size:12px;letter-spacing:0.34em;color:rgba(255,255,255,0.44);margin-bottom:32px;text-align:center}
.card{
  width:100%;background:linear-gradient(180deg, rgba(14,32,20,0.96), rgba(8,20,14,0.96));
  border:1px solid rgba(42,255,128,0.18);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:24px;padding:32px 26px 26px;text-align:center;
  box-shadow:0 0 0 1px rgba(42,255,128,0.06) inset,0 24px 80px rgba(0,0,0,0.7);
}
.icon-box{width:68px;height:68px;margin:0 auto 18px;background:radial-gradient(circle at 30% 30%, rgba(42,255,128,0.18), rgba(42,255,128,0.05));border:1px solid rgba(42,255,128,0.22);border-radius:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 24px rgba(42,255,128,0.12) inset}
.icon-box svg{width:28px;height:28px;stroke:#2aff80;stroke-width:2;fill:none}
.h2{font-family:'Space Grotesk',sans-serif;font-size:18.5px;font-weight:700;margin-bottom:14px;color:#f5fff8}
.p{font-size:13.2px;line-height:1.7;color:rgba(255,255,255,0.62);margin-bottom:10px}
.btn{
  width:100%;margin-top:22px;position:relative;overflow:hidden;
  background:linear-gradient(180deg, rgba(18,52,28,0.98), rgba(8,24,14,0.98));
  border:1px solid rgba(42,255,128,0.32);color:#6aff9e;
  border-radius:14px;padding:15px 20px;
  font-family:'Space Grotesk',sans-serif;font-size:14.8px;font-weight:600;
  cursor:pointer;transition:all .22s cubic-bezier(0.16,1,0.3,1);
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn:hover{border-color:rgba(42,255,128,0.6);background:rgba(42,255,128,0.14);box-shadow:0 0 28px rgba(42,255,128,0.28);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(0.98)}
.btn .arrow{transition:transform .22s}
.btn:hover .arrow{transform:translateX(4px)}
.btn.loading{pointer-events:none;opacity:0.85}
.btn .spinner{display:none;width:16px;height:16px;border:2px solid rgba(106,255,158,0.3);border-top-color:#6aff9e;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn.loading .spinner{display:block}
.btn.loading .btn-text{opacity:0.7}
.foot{margin-top:26px;font-size:11px;color:rgba(255,255,255,0.32);text-align:center}
@media (max-width:480px){
  .title{font-size:32px}
  .circle{width:108px;height:108px}
  body{padding:20px 16px}
}
@media (prefers-reduced-motion: reduce){
  .logo-ring,.circle,.glow-move{animation:none}
  .btn .arrow{transition:none}
}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="glow-static"></div>
<div class="glow-move" id="glowMove"></div>

<div class="wrap">
  <div class="logo-wrap">
    <div class="logo-ring"></div>
    <div class="circle">
      <!-- Cyber Emblem: Shield + Circuit -->
      <svg viewBox="0 0 24 24">
        <path d="M12 2.5l7 4v5.2c0 3.8-2.3 7.2-7 8.8-4.7-1.6-7-5-7-8.8V6.5l7-4z"/>
        <path d="M9 11.5l2 2 4-4"/>
        <circle cx="12" cy="8" r="1" fill="#2aff80" stroke="none"/>
      </svg>
    </div>
  </div>

  <div class="title">CYBER CORE</div>
  <div class="moved">THIS CORE HAS MOVED</div>

  <div class="card">
    <div class="icon-box"><svg viewBox="0 0 24 24"><path d="M10 13V8l6 0v2"/><path d="M14 11l5-5h-3V3"/><rect x="3" y="7" width="12" height="11" rx="2"/></svg></div>
    <div class="h2">Everything is now in one place</div>
    <div class="p">Both bots have been combined into a single, merged version.</div>
    <div class="p">Head over there to pair your number and access all the features.</div>
    <button class="btn" id="goBtn">
      <span class="btn-text">Merged Version</span>
      <span class="arrow">↗</span>
      <div class="spinner"></div>
    </button>
  </div>

  <div class="foot">All bots are now available on the merged platform</div>
</div>

<script>
const TARGET="https://storm-cyber-pair-url.onrender.com";
const btn=document.getElementById('goBtn');
btn.onclick=()=>{
  btn.classList.add('loading');
  btn.querySelector('.btn-text').textContent='Opening...';
  setTimeout(()=>{ location.href=TARGET; }, 450);
};

// Optimized Stars - battery friendly
const cs=document.getElementById('stars'),xs=cs.getContext('2d');let w,h,stars=[],animId,visible=true;
function rs(){w=cs.width=innerWidth;h=cs.height=innerHeight}
addEventListener('resize',rs);rs();
const starCount = innerWidth < 480 ? 90 : 130;
for(let i=0;i<starCount;i++)stars.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.1+0.2,s:Math.random()*0.25+0.04,op:Math.random()*0.6+0.2,tw:Math.random()*0.015+0.003});
function anim(){
 if(!visible){animId=requestAnimationFrame(anim);return}
 xs.clearRect(0,0,w,h);xs.fillStyle='#020a06';xs.fillRect(0,0,w,h);
 const t=Date.now();
 stars.forEach(s=>{
  s.y-=s.s;if(s.y<0){s.y=h;s.x=Math.random()*w}
  const twinkle = Math.sin(t*s.tw)*0.2;
  let o=s.op+twinkle;if(o>0.9)o=0.9;if(o<0.15)o=0.15;
  xs.beginPath();xs.arc(s.x,s.y,s.r,0,6.283);
  xs.fillStyle=`rgba(110,255,170,${o})`;
  if(s.r>0.8){xs.shadowBlur=s.r*3;xs.shadowColor='#22ff7a'}else{xs.shadowBlur=0}
  xs.fill();xs.shadowBlur=0;
 });
 animId=requestAnimationFrame(anim);
}
document.addEventListener('visibilitychange',()=>{visible=document.visibilityState==='visible'});
anim();
</script>
</body>
  </html>
