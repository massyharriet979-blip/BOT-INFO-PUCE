<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STORM HUB - MOVED</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020202;color:#fff;font-family:'JetBrains Mono',monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
body::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% -10%, rgba(0,255,136,0.15) 0%, transparent 60%), radial-gradient(ellipse at 80% 100%, rgba(0,255,136,0.08) 0%, transparent 50%)}
canvas#storm{position:absolute;inset:0;width:100%;height:100%;z-index:0;opacity:0.6}
.light-beam{position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(105deg, transparent 20%, rgba(0,255,136,0) 30%, rgba(0,255,136,0.9) 50%, rgba(255,255,255,1) 50.5%, rgba(0,255,136,0) 70%, transparent 80%);z-index:5;pointer-events:none;transform:skewX(-25deg)}
.light-beam.active{animation:beamSweep 1.2s ease-out forwards}
@keyframes beamSweep{0%{left:-100%}100%{left:100%}}
.container{position:relative;z-index:2;width:100%;max-width:520px;padding:20px;text-align:center}
.top-label{font-size:10px;letter-spacing:4px;color:#00ff88;margin-bottom:10px;opacity:0;animation:fadeIn 0.8s 0.2s forwards}
.title{font-family:'Orbitron',sans-serif;font-size:42px;font-weight:900;letter-spacing:2px;line-height:1;margin-bottom:40px}
.title span{display:inline-block;overflow:hidden;white-space:nowrap;border-right:3px solid #00ff88;width:0}
.title span.typing{animation:typing 1.8s steps(15) forwards, blink 0.7s infinite}
.title span.done{border-right:none;width:auto}
@keyframes typing{from{width:0}to{width:100%}}
@keyframes blink{0%,50%{border-color:#00ff88}51%,100%{border-color:transparent}}
@keyframes fadeIn{to{opacity:1}}
.card{background:linear-gradient(180deg, rgba(15,15,15,0.95) 0%, rgba(5,5,5,0.98) 100%);border:1px solid rgba(0,255,136,0.15);border-radius:24px;padding:36px 28px;position:relative;backdrop-filter:blur(20px);box-shadow:0 0 0 1px rgba(0,255,136,0.05), 0 20px 60px rgba(0,0,0,0.8), 0 0 80px rgba(0,255,136,0.08);transform:translateY(20px);opacity:0;animation:cardIn 0.8s 2s forwards}
@keyframes cardIn{to{transform:translateY(0);opacity:1}}
.logo-wrap{width:84px;height:84px;margin:0 auto 20px;position:relative;animation:float 3.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.logo-ring{position:absolute;inset:-8px;border:1px solid rgba(0,255,136,0.2);border-radius:50%;animation:pulseRing 2.5s ease-out infinite}
.logo-ring:nth-child(2){animation-delay:0.5s}.logo-ring:nth-child(3){animation-delay:1s}
@keyframes pulseRing{0%{transform:scale(0.85);opacity:0.8}100%{transform:scale(1.4);opacity:0}}
.logo{width:100%;height:100%;background:radial-gradient(circle at 30% 30%, #1a1a1a, #000);border:1px solid rgba(0,255,136,0.3);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;position:relative;z-index:1;box-shadow:0 0 30px rgba(0,255,136,0.2), inset 0 0 20px rgba(0,255,136,0.05)}
.card h2{font-size:11px;letter-spacing:3px;color:#888;margin-bottom:12px;font-weight:400}
.card p{font-size:13px;line-height:1.7;color:#aaa;margin-bottom:28px}
.btn-wrap{position:relative;display:inline-block;border-radius:100px;padding:1px;background:linear-gradient(90deg, transparent, #00ff88, transparent);background-size:200% 100%;animation:borderShine 3s linear infinite}
@keyframes borderShine{0%{background-position:-200% 0}100%{background-position:200% 0}}
.btn{display:flex;align-items:center;gap:8px;background:#00ff88;color:#000;font-family:'Orbitron',sans-serif;font-weight:700;font-size:13px;letter-spacing:1px;padding:14px 32px;border-radius:100px;text-decoration:none;transition:all 0.3s;position:relative;overflow:hidden}
.btn:hover{transform:scale(1.03);box-shadow:0 0 30px rgba(0,255,136,0.6)}
.bottom{margin-top:32px;font-size:9px;letter-spacing:3px;color:#444;opacity:0;animation:fadeIn 0.8s 2.8s forwards}
</style>
</head>
<body>
<canvas id="storm"></canvas>
<div class="light-beam" id="beam"></div>
<div class="container">
<div class="top-label">STORM HUB</div>
<div class="title"><span id="typeText">WE HAVE EVOLVED</span></div>
<div class="card">
<div class="logo-wrap"><div class="logo-ring"></div><div class="logo-ring"></div><div class="logo-ring"></div><div class="logo">⚡</div></div>
<h2>EVERYTHING IS NOW UNIFIED</h2>
<p>STORM CYBER MD has been rebuilt into one powerful hub. Faster pairing, stronger protection, all features in one place.<br>Head over to pair your number and activate your bot.</p>
<div class="btn-wrap"><a href="#" class="btn">↗ Enter New Hub</a></div>
</div>
<div class="bottom">ALL SYSTEMS ARE NOW LIVE ON THE NEW STORM PLATFORM</div>
</div>
<script>
const canvas=document.getElementById('storm');const ctx=canvas.getContext('2d');let w,h,particles=[];
function resize(){w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight}
window.addEventListener('resize',resize);resize();
class P{constructor(){this.reset()}reset(){this.x=Math.random()*w;this.y=Math.random()*-h;this.len=Math.random()*20+10;this.speed=Math.random()*3+2;this.opacity=Math.random()*0.5+0.1}draw(){ctx.beginPath();ctx.strokeStyle=`rgba(0,255,136,${this.opacity})`;ctx.lineWidth=1;ctx.moveTo(this.x,this.y);ctx.lineTo(this.x-2,this.y+this.len);ctx.stroke();this.y+=this.speed;if(this.y>h)this.reset()}}
for(let i=0;i<90;i++)particles.push(new P());
function loop(){ctx.clearRect(0,0,w,h);particles.forEach(p=>p.draw());if(Math.random()<0.003){ctx.fillStyle='rgba(0,255,136,0.03)';ctx.fillRect(0,0,w,h)}requestAnimationFrame(loop)}loop();
const typeEl=document.getElementById('typeText');const beam=document.getElementById('beam');
setTimeout(()=>{typeEl.classList.add('typing')},400);
typeEl.addEventListener('animationend',(e)=>{if(e.animationName==='typing'){setTimeout(()=>{typeEl.classList.remove('typing');typeEl.classList.add('done');beam.classList.add('active');},300);setTimeout(()=>beam.classList.remove('active'),1500)}});
</script>
</body>
</html>
