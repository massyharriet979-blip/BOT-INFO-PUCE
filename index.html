<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STORM NEXUS - MOVED</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020a06;color:#fff;font-family:'JetBrains Mono',monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;padding:20px}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.glow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%, rgba(0,255,136,0.32) 0%, transparent 62%);z-index:2;pointer-events:none}
.wrap{position:relative;z-index:10;width:100%;max-width:480px;display:flex;flex-direction:column;align-items:center}
.circle{width:122px;height:122px;border-radius:50%;background:radial-gradient(circle at 30% 30%, #123a22, #000);border:2px solid #1ed760;box-shadow:0 0 0 6px rgba(30,215,96,0.12),0 0 55px rgba(30,215,96,0.55),inset 0 0 24px rgba(30,215,96,0.25);display:flex;align-items:center;justify-content:center;margin-bottom:22px}
.circle svg{width:32px;height:32px;stroke:#1ed760;stroke-width:1.8;fill:none}
.title{font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:700;color:#2be87a;text-shadow:0 0 24px rgba(43,232,122,0.75);margin-bottom:6px;letter-spacing:0.02em}
.moved{font-size:13px;letter-spacing:0.34em;color:rgba(255,255,255,0.44);margin-bottom:30px}
.card{width:100%;background:rgba(8,22,14,0.95);border:1px solid rgba(0,255,136,0.18);backdrop-filter:blur(16px);border-radius:22px;padding:30px 24px 24px;box-shadow:0 0 0 1px rgba(0,255,136,0.06) inset,0 24px 70px rgba(0,0,0,0.7);text-align:center}
.icon-box{width:66px;height:66px;margin:0 auto 16px;background:rgba(0,255,136,0.08);border:1px solid rgba(0,255,136,0.2);border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 32px rgba(0,255,136,0.15) inset}
.icon-box svg{width:28px;height:28px;stroke:#2be87a;stroke-width:2;fill:none}
.h2{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;margin-bottom:12px}
.p{font-size:13.3px;line-height:1.7;color:rgba(255,255,255,0.58);margin-bottom:10px}
.btn{width:100%;margin-top:20px;background:linear-gradient(180deg, rgba(10,38,22,0.95), rgba(6,22,13,0.95));border:1px solid rgba(0,255,136,0.35);color:#5cff9a;border-radius:14px;padding:15px;font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 0 30px rgba(0,255,136,0.15);transition:all .2s}
.btn:hover{background:rgba(0,255,136,0.16);transform:translateY(-1px);box-shadow:0 0 36px rgba(0,255,136,0.35)}
.foot{margin-top:28px;font-size:11px;letter-spacing:0.06em;color:rgba(255,255,255,0.28)}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="glow"></div>

<div class="wrap">
  <div class="circle"><svg viewBox="0 0 24 24"><path d="M12 2.5l7 4v7l-7 4-7-4v-7l7-4z"/></svg></div>
  <div class="title">STORM NEXUS</div>
  <div class="moved">PORTAL RELOCATED</div>
  <div class="card">
    <div class="icon-box"><svg viewBox="0 0 24 24"><path d="M10 13V8l6 0v2"/><path d="M14 11l5-5h-3V3"/><rect x="3" y="7" width="12" height="11" rx="2"/></svg></div>
    <div class="h2">Unified Access Active</div>
    <div class="p">All systems fused into one final hub.</div>
    <div class="p">Move to the main portal to link your number and unlock everything.</div>
    <button class="btn" id="goBtn">↗ Open Main Hub</button>
  </div>
  <div class="foot">All systems now live on the unified portal</div>
</div>

<script>
const TARGET="https://storm-cyber-pair-url.onrender.com";
document.getElementById('goBtn').onclick=()=>location.href=TARGET;

// ONLY STARS - NO LIGHTNING
const cs=document.getElementById('stars'),xs=cs.getContext('2d');let w,h,stars=[];
function rs(){w=cs.width=innerWidth;h=cs.height=innerHeight}addEventListener('resize',rs);rs();
for(let i=0;i<240;i++)stars.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.5+0.4,s:Math.random()*0.4+0.08,op:Math.random()*0.85+0.25});
(function anim(){
xs.clearRect(0,0,w,h);xs.fillStyle='#020a06';xs.fillRect(0,0,w,h);
stars.forEach(s=>{s.y-=s.s;if(s.y<0){s.y=h;s.x=Math.random()*w}
xs.beginPath();xs.arc(s.x,s.y,s.r,0,6.283);
xs.fillStyle=`rgba(115,255,185,${s.op})`;
xs.shadowBlur=s.r*4.5;xs.shadowColor='#1ed760';xs.fill();xs.shadowBlur=0;
});
requestAnimationFrame(anim)})();
</script>
</body>
</html>
