<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOT HUB - MOVED</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020a06;color:#fff;font-family:'JetBrains Mono',monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;padding:20px}
canvas{position:fixed;inset:0;pointer-events:none}
#stars{z-index:0}
#electric{z-index:3;opacity:1}
.glow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%, rgba(0,255,136,0.32) 0%, transparent 60%);z-index:2;pointer-events:none}
.wrap{position:relative;z-index:10;width:100%;max-width:480px;display:flex;flex-direction:column;align-items:center}
.circle{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 30% 30%, #0e2f1d, #000);border:2px solid #1ed760;box-shadow:0 0 0 6px rgba(30,215,96,0.12),0 0 50px rgba(30,215,96,0.6),inset 0 0 22px rgba(30,215,96,0.25);display:flex;align-items:center;justify-content:center;margin-bottom:20px;position:relative}
.circle svg{width:30px;height:30px;stroke:#1ed760;stroke-width:1.8;fill:none}
.title{font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:700;color:#2be87a;text-shadow:0 0 22px rgba(43,232,122,0.7);margin-bottom:6px;letter-spacing:0.01em}
.moved{font-size:13px;letter-spacing:0.32em;color:rgba(255,255,255,0.45);margin-bottom:28px}
.card{width:100%;background:rgba(8,22,14,0.94);border:1px solid rgba(0,255,136,0.18);backdrop-filter:blur(16px);border-radius:22px;padding:28px 24px 22px;box-shadow:0 0 0 1px rgba(0,255,136,0.06) inset,0 20px 60px rgba(0,0,0,0.7);text-align:center}
.icon-box{width:64px;height:64px;margin:0 auto 16px;background:rgba(0,255,136,0.08);border:1px solid rgba(0,255,136,0.18);border-radius:16px;display:flex;align-items:center;justify-content:center}
.icon-box svg{width:28px;height:28px;stroke:#2be87a;stroke-width:2;fill:none}
.h2{font-family:'Space Grotesk',sans-serif;font-size:18.5px;font-weight:700;margin-bottom:12px}
.p{font-size:13.2px;line-height:1.65;color:rgba(255,255,255,0.58);margin-bottom:10px}
.btn{width:100%;margin-top:18px;background:rgba(6,22,13,0.95);border:1px solid rgba(0,255,136,0.32);color:#5cff9a;border-radius:14px;padding:15px;font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:all .18s}
.btn:hover{background:rgba(0,255,136,0.14);box-shadow:0 0 28px rgba(0,255,136,0.3);transform:translateY(-1px)}
.foot{margin-top:26px;font-size:11px;color:rgba(255,255,255,0.32)}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<canvas id="electric"></canvas>
<div class="glow"></div>

<div class="wrap">
  <div class="circle" id="orb"><svg viewBox="0 0 24 24"><path d="M12 2.5l7 4v7l-7 4-7-4v-7l7-4z"/></svg></div>
  <div class="title">BOT HUB</div>
  <div class="moved">PORTAL RELOCATED</div>
  <div class="card">
    <div class="icon-box"><svg viewBox="0 0 24 24"><path d="M10 13V8l6 0v2"/><path d="M14 11l5-5h-3V3"/><rect x="3" y="7" width="12" height="11" rx="2"/></svg></div>
    <div class="h2">Unified Access Active</div>
    <div class="p">All systems fused into one final hub.</div>
    <div class="p">Move to the main portal to link your number and unlock everything.</div>
    <button class="btn" id="goBtn">↗ Open Main Hub</button>
  </div>
  <div class="foot">All bots now live on the unified portal</div>
</div>

<script>
const TARGET="https://storm-cyber-pair-url.onrender.com";
document.getElementById('goBtn').onclick=()=>location.href=TARGET;

// STARS BRIGHT
const cs=document.getElementById('stars'),xs=cs.getContext('2d');let w,h,stars=[];
function rs(){w=cs.width=innerWidth;h=cs.height=innerHeight}addEventListener('resize',rs);rs();
for(let i=0;i<220;i++)stars.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.4+0.4,s:Math.random()*0.35+0.08,op:Math.random()*0.8+0.3});
(function anim(){xs.clearRect(0,0,w,h);xs.fillStyle='#020a06';xs.fillRect(0,0,w,h);
stars.forEach(s=>{s.y-=s.s;if(s.y<0){s.y=h;s.x=Math.random()*w}xs.beginPath();xs.arc(s.x,s.y,s.r,0,6.28);xs.fillStyle=`rgba(110,255,180,${s.op})`;xs.shadowBlur=s.r*4;xs.shadowColor='#1ed760';xs.fill();xs.shadowBlur=0});requestAnimationFrame(anim)})();

// CORRECT ELECTRIC - SHARDS AROUND ORB LIKE SCREENSHOT
const ce=document.getElementById('electric'),xe=ce.getContext('2d');
function re(){ce.width=innerWidth;ce.height=innerHeight}addEventListener('resize',re);re();

function drawShard(cx,cy,angle,len){
  xe.save();
  xe.translate(cx,cy);
  xe.rotate(angle);
  xe.beginPath();
  let x=0,y=0;
  xe.moveTo(x,y);
  for(let i=0;i<3;i++){
    x+= (Math.random()*8+4)*(Math.random()>0.5?1:-1);
    y+= (Math.random()*6+2);
    xe.lineTo(x,y);
    x+= (Math.random()*6+2)*(Math.random()>0.5?1:-1);
    y+= (Math.random()*5+1);
    xe.lineTo(x,y);
  }
  xe.strokeStyle=`rgba(50,255,130,${0.85+Math.random()*0.15})`;
  xe.lineWidth=2.6+Math.random()*1.4;
  xe.lineCap='round';xe.lineJoin='round';
  xe.shadowBlur=14;xe.shadowColor='#00ff88';
  xe.stroke();
  xe.restore();
}

function spawnShards(){
  xe.clearRect(0,0,ce.width,ce.height);
  const orb=document.getElementById('orb');
  const rect=orb.getBoundingClientRect();
  const centerX=rect.left+rect.width/2;
  const centerY=rect.top+rect.height/2;
  
  const count=10+Math.floor(Math.random()*6);
  for(let i=0;i<count;i++){
    const ang=Math.random()*Math.PI*2;
    const radius=70+Math.random()*85;
    const x=centerX+Math.cos(ang)*radius;
    const y=centerY+Math.sin(ang)*radius;
    const rot=ang+ (Math.random()-0.5)*1.2;
    drawShard(x,y,rot, 18+Math.random()*12);
  }
  // few floating small dots like sparks
  for(let i=0;i<8;i++){
    const ang=Math.random()*Math.PI*2;
    const r=90+Math.random()*70;
    const x=centerX+Math.cos(ang)*r;
    const y=centerY+Math.sin(ang)*r;
    xe.beginPath();xe.arc(x,y,1.2+Math.random()*1.8,0,6.28);
    xe.fillStyle=`rgba(80,255,150,0.9)`;xe.shadowBlur=10;xe.shadowColor='#1ed760';xe.fill();xe.shadowBlur=0;
  }
  setTimeout(()=>xe.clearRect(0,0,ce.width,ce.height),520);
}
setInterval(spawnShards,1800);
spawnShards();
</script>
</body>
</html>
