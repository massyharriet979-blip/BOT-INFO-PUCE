<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER CORE - MOVED</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020a06;color:#fff;font-family:'JetBrains Mono',monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:20px;position:relative}
#stars{position:fixed;inset:0;z-index:0}
.glow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%, rgba(0,255,136,0.32) 0%, transparent 62%);z-index:1;pointer-events:none}
.wrap{position:relative;z-index:10;width:100%;max-width:480px;display:flex;flex-direction:column;align-items:center}
.circle{width:124px;height:124px;border-radius:50%;background:radial-gradient(circle at 30% 30%, #143e24, #000);border:2px solid #1ed760;box-shadow:0 0 0 6px rgba(30,215,96,0.14),0 0 60px rgba(30,215,96,0.6);display:flex;align-items:center;justify-content:center;margin-bottom:28px;opacity:0;animation:fadeIn 0.6s 1.2s forwards}
.circle svg{width:32px;height:32px;stroke:#1ed760;stroke-width:1.8;fill:none}
.title-wrap{position:relative;height:54px;width:100%;display:flex;justify-content:center;align-items:center;margin-bottom:8px;overflow:visible}
.letter{position:absolute;font-family:'Space Grotesk',sans-serif;font-size:42px;font-weight:700;color:#2aff80;text-shadow:0 0 28px rgba(43,255,130,0.85);opacity:0;will-change:transform}
.moved{font-size:13px;letter-spacing:0.34em;color:rgba(255,255,255,0.46);margin-bottom:30px;opacity:0;animation:fadeIn 0.6s 1.6s forwards}
.card{width:100%;background:rgba(8,22,14,0.96);border:1px solid rgba(0,255,136,0.2);backdrop-filter:blur(16px);border-radius:22px;padding:30px 24px 24px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,0.7);opacity:0;animation:fadeIn 0.8s 1.9s forwards}
.icon-box{width:66px;height:66px;margin:0 auto 16px;background:rgba(0,255,136,0.08);border:1px solid rgba(0,255,136,0.22);border-radius:16px;display:flex;align-items:center;justify-content:center}
.icon-box svg{width:28px;height:28px;stroke:#2aff80;stroke-width:2;fill:none}
.h2{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;margin-bottom:12px}
.p{font-size:13.3px;line-height:1.7;color:rgba(255,255,255,0.62);margin-bottom:10px}
.btn{width:100%;margin-top:20px;background:linear-gradient(180deg, rgba(10,38,22,0.98), rgba(6,22,13,0.98));border:1px solid rgba(0,255,136,0.38);color:#5cff9a;border-radius:14px;padding:15px;font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 0 32px rgba(0,255,136,0.18);transition:all .2s}
.btn:hover{background:rgba(0,255,136,0.16);transform:translateY(-1px)}
.foot{margin-top:28px;font-size:11px;color:rgba(255,255,255,0.3);opacity:0;animation:fadeIn 0.6s 2.2s forwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="glow"></div>

<div class="wrap">
  <div class="circle"><svg viewBox="0 0 24 24"><path d="M12 2.5l7 4v7l-7 4-7-4v-7l7-4z"/></svg></div>
  <div class="title-wrap" id="titleWrap"></div>
  <div class="moved">PORTAL RELOCATED</div>
  <div class="card">
    <div class="icon-box"><svg viewBox="0 0 24 24"><path d="M10 13V8l6 0v2"/><path d="M14 11l5-5h-3V3"/><rect x="3" y="7" width="12" height="11" rx="2"/></svg></div>
    <div class="h2">Unified Access Active</div>
    <div class="p">All systems fused into one final hub.</div>
    <div class="p">Move to the main portal to link your number and unlock everything.</div>
    <button class="btn" id="goBtn">↗ Open Main Hub</button>
  </div>
  <div class="foot">All systems now live on the unified portal</div>
</div>

<script>
const TARGET="https://storm-cyber-pair-url.onrender.com";
document.getElementById('goBtn').onclick=()=>{playGlass(true);setTimeout(()=>location.href=TARGET,180)};

// STARS BRIGHT
const cs=document.getElementById('stars'),xs=cs.getContext('2d');let w,h,stars=[];
function rs(){w=cs.width=innerWidth;h=cs.height=innerHeight}addEventListener('resize',rs);rs();
for(let i=0;i<260;i++)stars.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.6+0.4,s:Math.random()*0.45+0.08,op:Math.random()*0.85+0.3});
(function anim(){xs.clearRect(0,0,w,h);xs.fillStyle='#020a06';xs.fillRect(0,0,w,h);
stars.forEach(s=>{s.y-=s.s;if(s.y<0){s.y=h;s.x=Math.random()*w}xs.beginPath();xs.arc(s.x,s.y,s.r,0,6.283);xs.fillStyle=`rgba(115,255,185,${s.op})`;xs.shadowBlur=s.r*4.5;xs.shadowColor='#1ed760';xs.fill();xs.shadowBlur=0});requestAnimationFrame(anim)})();

// GLASS SOUND
let audioCtx;
function getCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function playGlass(final=false){
 try{
  const ctx=getCtx();const now=ctx.currentTime;
  for(let i=0;i<(final?3:1);i++){
    const o=ctx.createOscillator();const g=ctx.createGain();
    o.type='sine';o.frequency.setValueAtTime(1200+Math.random()*1800+i*300,now+i*0.04);
    o.frequency.exponentialRampToValueAtTime(600,now+i*0.04+0.35);
    g.gain.setValueAtTime(0,now+i*0.04);g.gain.linearRampToValueAtTime(final?0.5:0.28,now+i*0.04+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,now+i*0.04+0.6);
    o.connect(g);g.connect(ctx.destination);o.start(now+i*0.04);o.stop(now+i*0.04+0.7);
    // second harmonic for glass
    const o2=ctx.createOscillator();const g2=ctx.createGain();
    o2.frequency.setValueAtTime(2400+Math.random()*1000,now+i*0.04);
    g2.gain.setValueAtTime(0,now+i*0.04);g2.gain.linearRampToValueAtTime(0.15,now+i*0.04+0.01);
    g2.gain.exponentialRampToValueAtTime(0.001,now+i*0.04+0.4);
    o2.connect(g2);g2.connect(ctx.destination);o2.start(now+i*0.04);o2.stop(now+i*0.04+0.5);
  }
 }catch(e){}
}

// CYBER CORE ASSEMBLE ANIMATION
const text="CYBER CORE";
const wrap=document.getElementById('titleWrap');
const letters=[];
const finalPositions=[];

// measure final positions
const temp=document.createElement('div');
temp.style.position='absolute';temp.style.visibility='hidden';temp.style.display='flex';temp.style.fontFamily="'Space Grotesk',sans-serif";temp.style.fontSize='42px';temp.style.fontWeight='700';
temp.style.letterSpacing='0.02em';document.body.appendChild(temp);
[...text].forEach(ch=>{
  const sp=document.createElement('span');sp.textContent=ch===' '?' ':ch;sp.style.padding='0 1.5px';temp.appendChild(sp);
});
document.body.offsetHeight;
let acc=0;
[...temp.children].forEach(el=>{
  finalPositions.push(acc+el.offsetWidth/2);
  acc+=el.offsetWidth+3;
});
const totalW=acc;
temp.remove();

// create scattered letters
[...text].forEach((ch,i)=>{
  const l=document.createElement('div');
  l.className='letter';
  l.textContent=ch===' '?' ':ch;
  // scattered random start
  const sx=(Math.random()-0.5)*innerWidth*1.2;
  const sy=(Math.random()-0.5)*innerHeight*0.8;
  const rot=(Math.random()-0.5)*720;
  l.style.transform=`translate(${sx}px, ${sy}px) rotate(${rot}deg) scale(0.3)`;
  l.style.opacity='1';
  wrap.appendChild(l);
  letters.push({el:l, fx:finalPositions[i]-totalW/2, fy:0, sx, sy, rot});
});

// animate to center
setTimeout(()=>{
  getCtx().resume?.();
  letters.forEach((lt,idx)=>{
    setTimeout(()=>{
      lt.el.style.transition=`transform 0.75s cubic-bezier(0.16,1,0.3,1), opacity 0.4s`;
      lt.el.style.transform=`translate(${lt.fx}px, ${lt.fy}px) rotate(0deg) scale(1)`;
      playGlass(false);
      if(idx===letters.length-1){
        setTimeout(()=>playGlass(true),300);
      }
    }, idx*65);
  });
}, 350);

// try auto sound on first interaction if blocked
document.body.addEventListener('click',()=>{getCtx().resume();},{once:true});
document.body.addEventListener('touchstart',()=>{getCtx().resume();},{once:true});
</script>
</body>
</html>
